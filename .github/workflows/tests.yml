# Runs the server tests on GitHub every time code is pushed.
# Result shows as a green tick / red cross next to each commit.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          TZ: Asia/Kathmandu